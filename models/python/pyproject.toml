[project]
name = "models"
version = "0.1.0"
description = "Shared models"
requires-python = ">=3.12"
dependencies = [
    "clients",
    "pydantic>=2.0.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.8.0",
    "bert-score>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
clients = { path = "../../clients/python", editable = true }
